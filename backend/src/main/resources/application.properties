spring.application.name=careflow-hospital-api
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:careflow}
spring.datasource.password=${DB_PASSWORD:careflow_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
app.jwt.secret=${JWT_SECRET:careflow-local-development-signing-key-rotate-before-deployment}
app.seed.default-password=${SEED_DEFAULT_PASSWORD:123456}
app.seed.enabled=${SEED_DATA_ENABLED:true}
