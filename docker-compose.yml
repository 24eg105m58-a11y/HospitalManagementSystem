services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MYSQL_DATABASE: careflow
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_URL: jdbc:mysql://database:3306/careflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      APP_ORIGIN: http://localhost
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
volumes:
  mysql_data:
